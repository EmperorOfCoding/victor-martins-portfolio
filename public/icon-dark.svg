<svg width="32" height="32" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark mode version - brighter colors on dark background -->
  <rect fill="#0f172a" width="180" height="180" rx="37"/>
  
  <g transform="translate(90, 90)">
    <!-- Outer glow -->
    <ellipse fill="#c4b5fd" cx="0" cy="0" rx="50" ry="35" opacity="0.3"/>
    
    <!-- Mid layer -->
    <ellipse fill="#a78bfa" cx="0" cy="0" rx="35" ry="25" opacity="0.5"/>
    
    <!-- Core -->
    <ellipse fill="#818cf8" cx="0" cy="0" rx="20" ry="15" opacity="0.8"/>
    <circle fill="#818cf8" cx="0" cy="0" r="8"/>
    
    <!-- Spiral arms -->
    <path opacity="0.4" 
      d="M 0,0 Q 25,-15 40,-25 Q 50,-30 55,-35" 
      stroke="#a78bfa" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path opacity="0.4" 
      d="M 0,0 Q -25,15 -40,25 Q -50,30 -55,35" 
      stroke="#a78bfa" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Stars -->
    <circle fill="#e0e7ff" cx="45" cy="-30" r="2.5"/>
    <circle fill="#e0e7ff" cx="-48" cy="28" r="2.5"/>
    <circle fill="#e0e7ff" cx="35" cy="40" r="2"/>
    <circle fill="#e0e7ff" cx="-40" cy="-35" r="2"/>
    <circle fill="#e0e7ff" cx="25" cy="-45" r="1.5"/>
    <circle fill="#e0e7ff" cx="-30" cy="45" r="1.5"/>
    
    <!-- Orbit -->
    <circle stroke="#818cf8" cx="0" cy="0" r="55" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4 8"/>
    <circle fill="#e0e7ff" cx="0" cy="-55" r="3"/>
  </g>
</svg>
