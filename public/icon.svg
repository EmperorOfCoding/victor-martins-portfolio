<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #f8f9fa; }
      .galaxy-core { fill: #6366f1; }
      .galaxy-mid { fill: #8b5cf6; }
      .galaxy-outer { fill: #a78bfa; }
      .star { fill: #4f46e5; }
      .orbit { stroke: #6366f1; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .galaxy-core { fill: #818cf8; }
      .galaxy-mid { fill: #a78bfa; }
      .galaxy-outer { fill: #c4b5fd; }
      .star { fill: #e0e7ff; }
      .orbit { stroke: #818cf8; }
    }
  </style>
  
  <!-- Background -->
  <rect class="bg" width="180" height="180" rx="37"/>
  
  <!-- Galaxy spiral -->
  <g transform="translate(90, 90)">
    <!-- Outer glow -->
    <ellipse class="galaxy-outer" cx="0" cy="0" rx="50" ry="35" opacity="0.3"/>
    
    <!-- Mid layer -->
    <ellipse class="galaxy-mid" cx="0" cy="0" rx="35" ry="25" opacity="0.5"/>
    
    <!-- Core -->
    <ellipse class="galaxy-core" cx="0" cy="0" rx="20" ry="15" opacity="0.8"/>
    <circle class="galaxy-core" cx="0" cy="0" r="8"/>
    
    <!-- Spiral arms -->
    <path class="galaxy-mid" opacity="0.4" 
      d="M 0,0 Q 25,-15 40,-25 Q 50,-30 55,-35" 
      stroke-width="6" stroke-linecap="round" fill="none" stroke="currentColor"/>
    <path class="galaxy-mid" opacity="0.4" 
      d="M 0,0 Q -25,15 -40,25 Q -50,30 -55,35" 
      stroke-width="6" stroke-linecap="round" fill="none" stroke="currentColor"/>
    
    <!-- Stars -->
    <circle class="star" cx="45" cy="-30" r="2.5"/>
    <circle class="star" cx="-48" cy="28" r="2.5"/>
    <circle class="star" cx="35" cy="40" r="2"/>
    <circle class="star" cx="-40" cy="-35" r="2"/>
    <circle class="star" cx="25" cy="-45" r="1.5"/>
    <circle class="star" cx="-30" cy="45" r="1.5"/>
    
    <!-- Orbiting element -->
    <circle class="orbit" cx="0" cy="0" r="55" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4 8"/>
    <circle class="star" cx="0" cy="-55" r="3">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="20s"
        repeatCount="indefinite"/>
    </circle>
  </g>
</svg>